name: "PR Agent Runner"
description: >
  Runs OpenCodeReview (OCR) on a pull request and posts review comments.
  Triggered on PR open or when a PR comment mentions the configured bot
  (@bot review / @bot fix / free-form chat). Fully self-contained: checks out
  the consumer repo and the runner CLI, generates a GitHub App token, runs OCR,
  and posts results.
inputs:
  app-client-id:
    description: "GitHub App client ID for token generation"
    required: true
  app-private-key:
    description: "GitHub App private key for token generation"
    required: true
  ocr-llm-url:
    description: "LLM endpoint URL used by OCR"
    required: true
  ocr-llm-token:
    description: "LLM API token used by OCR"
    required: true
  ocr-llm-model:
    description: "LLM model name used by OCR"
    required: true
  node-version:
    description: "Node.js version"
    required: false
    default: "24"
  pnpm-version:
    description: "pnpm version"
    required: false
    default: "11"
  fetch-depth:
    description: "Git fetch depth for the consumer repo checkout"
    required: false
    default: "0"
  ocr-version:
    description: "OpenCodeReview CLI version to install"
    required: false
    default: "1.7.16"
  ocr-llm-max-tokens:
    description: "LLM max tokens (optional)"
    required: false
    default: ""
  ocr-use-anthropic:
    description: "Set 'true' to use the Anthropic protocol (optional)"
    required: false
    default: ""
  ocr-llm-protocol:
    description: "LLM protocol: anthropic | openai (optional, overrides ocr-use-anthropic)"
    required: false
    default: ""
  ocr-language:
    description: "Review language"
    required: false
    default: "English"
  bot-mention:
    description: "Bot mention trigger, e.g. '@my-bot'"
    required: false
    default: "@opencode-review"
  compose-pr:
    description: "Set 'true' to compose and update the PR title and body"
    required: false
    default: "false"
  sticky-summary:
    description: "Update the review summary in place across runs ('true') or post a fresh review each run ('false')"
    required: false
    default: "true"
  incremental:
    description: "Skip inline comments that overlap previously-posted bot comments"
    required: false
    default: "false"
  incremental-overlap-threshold:
    description: "IoU threshold in (0, 1] used to treat multi-line comments as duplicates in incremental mode"
    required: false
    default: "0.6"
  review-comment-batch-size:
    description: "Maximum number of inline comments packed into a single createReview call"
    required: false
    default: "50"
  route-severity-below:
    description: "Route findings at or below this severity to the summary (critical|high|medium|low; empty disables)"
    required: false
    default: ""
  route-categories:
    description: "Comma-separated categories to route to the summary (empty disables)"
    required: false
    default: ""
  runner-ref:
    description: "Git ref of the runner repository to use for the runner CLI"
    required: false
    default: "main"
  runner-repository:
    description: "Repository that hosts the runner CLI (owner/name)"
    required: false
    default: "makinosp/pr-agent-runner"
outputs:
  comments_total:
    description: "Total number of findings processed"
    value: ${{ steps.review.outputs.comments_total }}
  comments_inline:
    description: "Number of inline comments posted"
    value: ${{ steps.review.outputs.comments_inline }}
  comments_skipped:
    description: "Number of inline comments skipped as overlapping"
    value: ${{ steps.review.outputs.comments_skipped }}
  comments_routed:
    description: "Number of findings routed to the summary"
    value: ${{ steps.review.outputs.comments_routed }}
  comments_failed:
    description: "Number of comments that failed to post"
    value: ${{ steps.review.outputs.comments_failed }}
  summary_comment_url:
    description: "URL of the review carrying the summary"
    value: ${{ steps.review.outputs.summary_comment_url }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Generate App token
      id: app-token
      uses: actions/create-github-app-token@v3.2.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}

    - name: Checkout consumer repo
      uses: actions/checkout@v7
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Checkout review runner code
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.runner-repository }}
        ref: ${{ inputs.runner-ref }}
        path: review_runner
        fetch-depth: 1
        persist-credentials: false

    - name: Install OpenCodeReview CLI
      shell: bash
      run: pnpm add -g @alibaba-group/open-code-review@${{ inputs.ocr-version }}

    - name: Check PR comment and bot mention
      id: gate
      if: github.event_name == 'issue_comment'
      shell: bash
      env:
        COMMENT_BODY: ${{ github.event.comment.body }}
        ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
        COMMENT_USER_TYPE: ${{ github.event.comment.user.type }}
        BOT_MENTION: ${{ inputs.bot-mention }}
      run: |
        BOT_MENTION="${BOT_MENTION:-@opencode-review}"
        if [ -z "${ISSUE_PR_URL}" ]; then
          echo "Not a PR comment. Skipping."
          exit 0
        fi
        if [ "${COMMENT_USER_TYPE}" = "Bot" ]; then
          echo "Bot comment. Skipping."
          exit 0
        fi
        if ! echo "${COMMENT_BODY}" | grep -qF "${BOT_MENTION}"; then
          echo "No mention. Skipping."
          exit 0
        fi
        echo "triggered=true" >> "${GITHUB_OUTPUT}"

    - name: Resolve PR metadata
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_URL: ${{ github.event.issue.pull_request.url }}
      run: |
        if [ "${{ github.event_name }}" = "issue_comment" ]; then
          PR_PATH=$(echo "${PR_URL}" | sed -E 's#https://api.github.com/repos/([^/]+)/([^/]+)/pulls/([0-9]+)#\1 \2 \3#')
          set -- ${PR_PATH}
          echo "owner=${1}" >> "${GITHUB_OUTPUT}"
          echo "repo=${2}" >> "${GITHUB_OUTPUT}"
          echo "number=${3}" >> "${GITHUB_OUTPUT}"
          PR_DETAILS=$(gh api repos/${1}/${2}/pulls/${3} --jq '{base_ref: .base.ref, head_sha: .head.sha}')
          echo "base_ref=$(echo "${PR_DETAILS}" | jq -r '.base_ref')" >> "${GITHUB_OUTPUT}"
          echo "head_sha=$(echo "${PR_DETAILS}" | jq -r '.head_sha')" >> "${GITHUB_OUTPUT}"
        else
          echo "owner=${{ github.event.repository.owner.login }}" >> "${GITHUB_OUTPUT}"
          echo "repo=${{ github.event.repository.name }}" >> "${GITHUB_OUTPUT}"
          echo "number=${{ github.event.pull_request.number }}" >> "${GITHUB_OUTPUT}"
          echo "base_ref=${{ github.event.pull_request.base.ref }}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "${GITHUB_OUTPUT}"
        fi

    - name: Checkout PR head SHA
      if: steps.gate.outputs.triggered == 'true'
      uses: actions/checkout@v7
      with:
        ref: ${{ steps.pr.outputs.head_sha }}
        fetch-depth: 0
        token: ${{ steps.app-token.outputs.token }}

    - name: Run review runner
      id: review
      if: github.event_name == 'pull_request' || steps.gate.outputs.triggered == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        GITHUB_REPOSITORY: ${{ steps.pr.outputs.owner }}/${{ steps.pr.outputs.repo }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        COMMENT_ID: ${{ github.event.comment.id }}
        COMMENT_BODY: ${{ github.event.comment.body }}
        COMMENT_USER: ${{ github.event.comment.user.login }}
        BOT_MENTION: ${{ inputs.bot-mention }}
        BASE_REF: ${{ steps.pr.outputs.base_ref }}
        HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        OCR_LLM_URL: ${{ inputs.ocr-llm-url }}
        OCR_LLM_TOKEN: ${{ inputs.ocr-llm-token }}
        OCR_LLM_MODEL: ${{ inputs.ocr-llm-model }}
        OCR_LLM_MAX_TOKENS: ${{ inputs.ocr-llm-max-tokens }}
        OCR_USE_ANTHROPIC: ${{ inputs.ocr-use-anthropic }}
        OCR_LLM_PROTOCOL: ${{ inputs.ocr-llm-protocol }}
        OCR_LANGUAGE: ${{ inputs.ocr-language }}
        COMPOSE_PR: ${{ inputs.compose-pr }}
        REVIEW_STICKY_SUMMARY: ${{ inputs.sticky-summary }}
        REVIEW_INCREMENTAL: ${{ inputs.incremental }}
        REVIEW_INCREMENTAL_OVERLAP_THRESHOLD: ${{ inputs.incremental-overlap-threshold }}
        REVIEW_COMMENT_BATCH_SIZE: ${{ inputs.review-comment-batch-size }}
        REVIEW_ROUTE_SEVERITY_BELOW: ${{ inputs.route-severity-below }}
        REVIEW_ROUTE_CATEGORIES: ${{ inputs.route-categories }}
      run: |
        cd review_runner
        pnpm install
        cd ..
        node review_runner/src/cli.ts
